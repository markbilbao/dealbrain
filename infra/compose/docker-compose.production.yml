# Production overlay — extends base; no in-container Postgres (RDS).
# Fail-safe defaults: debug off, demo off, strict startup on.
#
# Usage:
#   export DEALBRAIN_IMAGE=ghcr.io/ORG/dealbrain@sha256:…   # same digest as staging
#   docker compose -f infra/compose/docker-compose.base.yml \
#                  -f infra/compose/docker-compose.production.yml up -d
#   docker compose -f infra/compose/docker-compose.base.yml \
#                  -f infra/compose/docker-compose.production.yml \
#                  --profile migrate run --rm migrate

name: dealbrain-production

services:
  api:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LAUNCH_STRICT_STARTUP: "true"
      ALLOW_DEMO_RESET_TOKENS: "false"
      TRANSACTIONAL_EMAIL_PROVIDER: "resend"
      TRANSACTIONAL_EMAIL_FROM_NAME: "PiqSavi"
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-https://piqsavi.com}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-piqsavi.com,www.piqsavi.com}
      LEGAL_PRIVACY_PUBLISHED_VERSION_ID: ${LEGAL_PRIVACY_PUBLISHED_VERSION_ID:-privacy-2026-09-11}
      LEGAL_TERMS_PUBLISHED_VERSION_ID: ${LEGAL_TERMS_PUBLISHED_VERSION_ID:-terms-2026-09-11}
      SEED_DEMO_DATA: "false"
      DEMO_LAUNCHER_ENABLED: "false"
      PRICE_HISTORY_SEED_DEMO_MOCK: "false"
      OPENAPI_PUBLIC_DOCS: "false"
      STRUCTURED_LOGGING_ENABLED: "true"
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: /dealbrain/production/api
        awslogs-stream-prefix: api
        awslogs-create-group: "false"
    labels:
      dealbrain.environment: production
      dealbrain.service: api

  migrate:
    environment:
      APP_ENV: production
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: /dealbrain/production/migrate
        awslogs-stream-prefix: migrate
        awslogs-create-group: "false"
    labels:
      dealbrain.environment: production
      dealbrain.service: migrate
