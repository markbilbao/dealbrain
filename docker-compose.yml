services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://dealbrain:dealbrain@db:5432/dealbrain
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      RATE_LIMITING_ENABLED: ${RATE_LIMITING_ENABLED:-true}
      SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
      STRUCTURED_LOGGING_ENABLED: ${STRUCTURED_LOGGING_ENABLED:-true}
      LAUNCH_READINESS_ENABLED: ${LAUNCH_READINESS_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealbrain
      POSTGRES_PASSWORD: dealbrain
      POSTGRES_DB: dealbrain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealbrain -d dealbrain"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: runtime
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://dealbrain:dealbrain@db:5432/dealbrain
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

volumes:
  postgres_data:
