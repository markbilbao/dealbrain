# Sprint 25a/25b.1/25b.2 — CI foundation (lint, tests, contracts, infra validate, image build).
# Does NOT deploy, apply Terraform to AWS, assume OIDC deploy roles, publish
# releasable GHCR images, or require production secrets.
# Releasable image publication is owned solely by build-image.yml (Sprint 25b.1).
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - sprint-25
      - sprint-25b2

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.15.8"

jobs:
  lint-and-test:
    name: Lint, contracts, and pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev

      # Sprint 25a policy: grandfather existing Ruff debt via committed baseline;
      # fail only on new lint codes per file or newly unformatted files.
      - name: Ruff lint/format (baseline gate)
        run: uv run python scripts/check_ruff_baseline.py

      - name: Secret scan (deterministic)
        run: uv run python scripts/secret_scan_25a.py

      - name: OpenAPI / API contract tests
        run: uv run pytest tests/unit/api_contract/test_openapi_drift.py tests/unit/api_contract -q

      - name: Protected-module and architecture-lock tests
        run: |
          uv run pytest \
            tests/unit/test_sprint22_protected_modules.py \
            tests/unit/persistence/test_sprint23_architecture.py \
            tests/unit/test_sprint25a_infrastructure.py \
            tests/unit/test_sprint25b1_image_publication.py \
            tests/unit/test_sprint25b2_oidc_iam.py \
            tests/unit/test_sprint25b5f_immutable_oidc_subject.py \
            -q

      - name: Full pytest suite
        run: uv run pytest -q

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate account (OIDC)
        working-directory: infra/terraform/account
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate staging
        working-directory: infra/terraform/environments/staging
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate production
        working-directory: infra/terraform/environments/production
        run: |
          terraform init -backend=false -input=false
          terraform validate

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose config (production)
        env:
          DEALBRAIN_IMAGE: ghcr.io/example-org/dealbrain:ci-test
          DATABASE_URL: postgresql+asyncpg://ci:CiStrongPass12@db.example:5432/dealbrain
          CORS_ORIGINS: https://example.com
          APP_ENV: production
        run: |
          docker compose \
            -f infra/compose/docker-compose.base.yml \
            -f infra/compose/docker-compose.production.yml \
            config >/dev/null

      - name: Compose config (staging)
        env:
          DEALBRAIN_IMAGE: ghcr.io/example-org/dealbrain:ci-test
          DATABASE_URL: postgresql+asyncpg://ci:CiStrongPass12@db.example:5432/dealbrain
          CORS_ORIGINS: https://staging.example.com
          APP_ENV: staging
        run: |
          docker compose \
            -f infra/compose/docker-compose.base.yml \
            -f infra/compose/docker-compose.staging.yml \
            config >/dev/null

  image:
    name: Docker image build (validate only; no GHCR publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PR and branch CI validate the production Dockerfile without publishing.
      # Releasable GHCR publication (immutable sha-<gitsha> + digest + manifest)
      # is owned exclusively by .github/workflows/build-image.yml.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            dealbrain:ci-${{ github.sha }}
            dealbrain:ci-local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image exists (no migrate at build)
        run: |
          docker image inspect "dealbrain:ci-${{ github.sha }}" >/dev/null
          # Build must not execute Alembic. COPY of alembic.ini / alembic/ for the
          # runtime migrate job is expected; only fail on shell/RUN layers.
          if docker history --no-trunc --format '{{.CreatedBy}}' "dealbrain:ci-${{ github.sha }}" \
            | grep -viE '^\s*(COPY|ADD)\b' \
            | grep -qi alembic; then
            echo "Unexpected alembic layer in image history" >&2
            exit 1
          fi
